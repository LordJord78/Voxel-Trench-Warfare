# ---------------------------------------------------------------------------
# TRENCHLINE — feel tuning
#
# Every number that decides how the game FEELS lives here. Logic modules read
# values by dotted key and never hard-code a magnitude. Edit freely; nothing in
# here changes behaviour structurally, only its shape and scale.
#
# Units: metres, seconds, degrees, kilograms.
# ---------------------------------------------------------------------------

[world]
# STRUCTURAL, not feel. Every other distance in this file is in metres and is
# converted with it. Changing it changes what the whole project means, so it is
# not a per-session override. 10 cm is Teardown's scale, and the reason for the
# web rebuild: at 0.5 m a sandbag was a cube.
voxel_size          = 0.10

size_x_m            = 256.0    # twice the Python map each way: room for reserve
size_y_m            = 32.0     # lines, a hamlet behind ours and a wood behind theirs
size_z_m            = 256.0
ground_level_m      = 16.0     # height of the undisturbed field surface
water_table_m       = 12.5     # below this, open cavities flood. Sits just
                               # under the trench floor: the line stays dry, but
                               # a crater deeper than ~2 m fills, and a shell in
                               # the trench floods it.

# The Python game meshed chunks, so it carried a rebuild budget and level-of-
# detail bands here. The web renderer ray-traces a sparse brick map instead:
# there is nothing to mesh and nothing to rebuild, only bricks to re-upload, so
# those settings went with the meshes.

[world.trench]
# Every distance here is metres and every voxel count is derived, because the
# same design is a different number of voxels on a different grid. The
# derivation is in generation.py and is asserted by tests/test_world.py.
depth_m             = 2.50     # field surface to duckboards
width_m             = 2.50     # wall to wall: walkway plus firing step
step_bench_m        = 0.50     # bench at full step height
step_tread_m        = 1.00     # stair below it, so the step can be mounted from
                               # anywhere along the walkway rather than only
                               # from a flight at one end
parados_m           = 0.50     # spoil on the friendly side; lower than the
                               # parapet so you are not silhouetted
parapet_min_m       = 1.00     # floor under the crest, above the local field
parapet_thickness_m = 2.00     # courses of spoil; the outer ones fall away, so
                               # a tall parapet is a bank and not a wall
bay_length_m        = 8.0      # traverse spacing
traverse_gap_m      = 1.00     # wall left between adjacent bay strips

# The across-bay treads carry as much rise as the player's step-up allows per
# column. Any bay needing more takes the remainder on a flight running ALONG the
# bay, which costs bay length (8 m of it) rather than walkway width.
firing_step_min_m   = 1.50     # the shallowest step that still works, and no
                               # taller than the across-bay stair can carry:
                               # (step_tread_m + step_bench_m) rounded to the
                               # grid, times whatever rise the step-up reaches
                               # per column. Exceed that and the step is only
                               # mountable from the flight at the end of the bay.
firing_step_max_m   = 3.50     # past this the parapet is a redoubt

# Crest clearance is NOT a global constant. Each fire bay measures the ground it
# has to see over, raises its step until a standing eye clears it, and builds
# its crest at step_top + (standing eye - crest_clearance_m). That puts a
# standing eye 0.12 m over its own crest and a crouched eye 0.40 m under it, in
# every bay, whatever the terrain is doing. Generation asserts it. (At 0.5 m
# voxels the Python game got the same 0.12 m by rounding the eye down to the
# grid; at 10 cm that rounding would leave 2 cm, so the clearance is stated.)
sight_range_m       = 60.0     # how far out the ground has to read
sight_near_m        = 14.0     # near band, where a rise walls you in outright
sight_percentile    = 88.0     # of corridor ground the standing eye must clear
sight_margin_m      = 0.40     # over that ground: covers ejecta
crest_smoothing_m   = 1.00     # max crest drop between neighbouring bays
crest_clearance_m   = 0.12     # standing eye over its own crest
crest_flat_m        = 1.00     # flat top of a parapet before it falls away at 45°

# Treads at 10 cm are real stairs, not one-voxel ledges: 0.30 m deep and 0.30 m
# up, inside the 0.55 m the player can step. The across-bay flight carries what
# it can in step_tread_m; the rest climbs along the bay, as in the Python game.
tread_depth_m       = 0.30
tread_rise_m        = 0.30
line_margin_m       = 6.0      # lines end in closed walls this far inside the map
floor_min_m         = 1.5      # no duckboard deeper than this above the map floor
floor_below_top_m   = 3.0      # nor closer than this under the map ceiling

# Ploughed farmland: broad swells, not chop. Amplitude is what gives no-man's-
# land shape; wavelength is what decides whether that shape blocks the peek.
# High-frequency octaves are the expensive kind — a 1 m bump 20 m out costs more
# view than a 1 m swell 60 m out — so amplitude buys relief and persistence
# spends it. Raised from 0.875 m once crest clearance stopped being global.
# Measured: amplitude does NOT change how far shell holes read (42-44 m across
# 1.0-3.0 m); an eye 1.1 m over the field is the binding constraint, not the
# terrain. What amplitude and the swale buy is the WORST bay: p10 crater reach
# 30 m -> 37 m. See tools/sightlines.py.
[world.field]
relief_amplitude_m  = 2.00     # +/- about the nominal ground level
relief_octaves      = 4
relief_cell_m       = 42.7     # base octave's cell, in metres so a bigger map
                               # keeps the same ground rather than stretching it
relief_persistence  = 0.34     # < 0.5: the fine octaves stay quiet

# Both lines sit on the shoulders of a shallow dry watercourse, which is what
# SUKHYI YAR is named for. This is the half of "relief" that actually makes
# no-man's-land read: an eye 1.1 m over a flat field sees ground past ~20 m
# edge-on however much vertical relief it has, and a concave dip is the one
# shape fully visible from its own rim. Kept shallow enough that the trough
# floor stays above the water table, so the middle holds shell holes and not a
# lake. Set to 0.0 for a flat field.
swale_depth_m       = 1.50
swale_margin_m      = 5.0      # how far past each line the dip reaches
ditches             = 3        # field drains, cut across the map with a drift

# Vertical silhouette: the only thing that reads at 40 m from an eye 1.1 m over
# a flat field, because it is seen against the sky rather than edge-on. Ground
# relief cannot do this at any amplitude; that was measured, not assumed.
[world.clutter]
fence_lines         = 6        # doubled with the map's width
poles               = 14

# Battlefield layout, in metres along z (0 = friendly rear, 256 = enemy rear)
# and along x. The Python map was 128 m square with two lines a side; at 256 m
# each side gets a reserve line, ours a hamlet behind it and theirs a wood.
[world.layout]
reserve_line_m        = 52.0
support_line_m        = 84.0
front_line_m          = 106.0
enemy_front_m         = 158.0
enemy_support_m       = 180.0
enemy_reserve_m       = 206.0
comm_trench_x_m       = [44.0, 128.0, 212.0]
enemy_comm_trench_x_m = [70.0, 186.0]
shelterbelt_z_m       = [44.0, 132.0, 214.0]
hamlet_z_m            = [8.0, 40.0]
wood_z_m              = [220.0, 252.0]
farm_m                = [66.0, 123.0]    # [x, z]: in no man's land, friendly half
culvert_m             = [180.0, 95.0]    # under the track behind our front line
hull_m                = [141.0, 137.0]   # out in the open, where reaching it costs you

# Shell holes. Radius is drawn from the Python game's distribution, in metres:
# min + gamma(shape, scale), capped. Open-field craters are bowls and rims in
# the terrain; direct hits on the lines are carved and collapsed at load.
[world.craters]
nml_count             = 300
rear_count            = 120
direct_hits_per_line  = 6
radius_min_m          = 0.70
gamma_shape           = 2.4
gamma_scale_m         = 0.575
radius_cap_m          = 3.25
direct_cap_m          = 2.10

[player]
mass                = 82.0
eye_height_standing = 1.62
eye_height_crouched = 1.10
eye_height_prone    = 0.34
eye_height_periscope = 2.20    # the mirror head, not your eye. 0.58 m over a
                               # standing eye, which is 0.70 m of clearance
                               # over the crest against standing's 0.12 m
radius              = 0.30
step_up             = 0.55     # one voxel plus tolerance: climb the firing step
climb_m             = 2.50     # firing-step timber this high over your feet is
                               # climbed when walked into from the step: a bench
                               # stands 1.0-2.2 m over the treads that lead to it
climb_speed         = 1.60     # m/s up the bench's face
gravity             = -19.6    # 2 g — arcade-leaning, keeps jumps snappy
jump_speed          = 5.0
ground_accel        = 62.0
air_accel           = 9.0
ground_friction     = 11.0
max_fall_speed      = 55.0
mouse_sensitivity   = 0.14
pitch_limit         = 88.0

# Stance is a tradeoff: speed and vision against how much of you is showing.
# `exposure` scales incoming hit probability; `sway_scale` multiplies weapon
# sway and recoil recovery time.
[stance.standing]
height              = 1.80
speed               = 4.1
sprint_speed        = 6.4
sway_scale          = 1.00
exposure            = 1.00
transition_time     = 0.00

[stance.crouched]
height              = 1.25
speed               = 2.0
sprint_speed        = 2.0
sway_scale          = 0.72
exposure            = 0.62
transition_time     = 0.22

[stance.prone]
height              = 0.55
speed               = 0.75
sprint_speed        = 0.75
sway_scale          = 0.38
exposure            = 0.28
transition_time     = 0.75

# Standing on the firing step: full vision, full exposure, and the trench no
# longer protects you. This is the fast/dangerous option against the periscope.
[stance.firing_step]
height              = 1.80
speed               = 1.2
sprint_speed        = 1.2
sway_scale          = 0.85
exposure            = 1.35
transition_time     = 0.30

# ---------------------------------------------------------------------------
# BALLISTICS
#
# Real physics, arcade nothing. Rounds are integrated with quadratic drag and
# real gravity — not the player's 2 g, which is a movement-feel number and has
# no business deciding where a bullet lands 300 m away.
# ---------------------------------------------------------------------------

[ballistics]
gravity             = -9.81    # m/s^2, actual
air_density         = 1.225    # kg/m^3 at sea level, 15 C
substeps_per_tick   = 4        # 240 Hz integration under a 60 Hz tick: a rifle
                               # round covers 14.7 m a tick and 3.7 m a
                               # substep (37 voxels at 10 cm); hits are found
                               # along each substep's segment, not at its end
pool_capacity       = 256      # rounds in the air at once; full is full
max_range_m         = 400.0    # wider than the 256 m map, so nothing vanishes
                               # mid-flight over open ground
max_flight_time_s   = 4.0

[weapon.assault_rifle]
name                = "5.45 assault rifle"
muzzle_velocity     = 880.0    # m/s
projectile_mass_kg  = 0.00343  # 3.43 g
drag_coefficient    = 0.295    # G7-ish for a boat-tailed spitzer
cross_section_m2    = 0.0000238   # 5.45 mm bore
rounds_per_minute   = 650.0
magazine            = 30
dispersion_moa      = 3.2      # cone half-angle, scaled by stance sway
reload_time_s       = 2.4
automatic           = true
tracer              = true
tracer_every        = 5        # every fifth round a tracer

# ---------------------------------------------------------------------------
# RECOIL
#
# Every recoil number is here. Nothing is hard-coded in a weapon class; adding
# a weapon means adding a [recoil.<key>] table, not editing logic.
#
# Two terms with different timescales:
#   kick   an impulse into a damped spring anchored at zero. The snap. Set by
#          settle_time_s directly, so "never fighting the gun for more than a
#          fraction of a second" is a number you type, not one you infer.
#   climb  an offset that accumulates over a burst, approaches a ceiling and
#          bleeds off when you stop. The pattern you have to correct.
#
# Feel first: the whole thing is LIGHT. If it reads as weightless rather than
# snappy, raise kick_pitch_deg before touching anything else.
# ---------------------------------------------------------------------------

[recoil.defaults]
kick_pitch_deg      = 0.30
kick_yaw_deg        = 0.00
settle_time_s       = 0.20     # kick back to 2% of its peak in this long
damping_ratio       = 1.00     # critically damped: fastest return, no bounce
climb_ceiling_deg   = 2.00
climb_per_shot_deg  = 0.30
climb_recovery_s    = 0.30
drift_yaw_deg       = 0.00
drift_onset_shots   = 6.0
drift_ramp_shots    = 4.0
jitter_pitch_deg    = 0.03
jitter_yaw_deg      = 0.05
burst_reset_s       = 0.28     # off the trigger this long and the pattern resets

# Tiny kick, a quick vertical climb that plateaus, and a mild rightward drift
# that only shows up once you are past about six rounds.
[recoil.assault_rifle]
kick_pitch_deg      = 0.34
settle_time_s       = 0.20     # peak lands 2 frames after the shot, gone in 0.22 s
climb_ceiling_deg   = 1.65     # ~2.4 m of rise at 100 m, held on the trigger
climb_per_shot_deg  = 0.27     # so the plateau arrives in about 8 rounds
climb_recovery_s    = 0.26
drift_yaw_deg       = 0.075    # rightward; positive yaw is right
drift_onset_shots   = 6.0
drift_ramp_shots    = 5.0
jitter_pitch_deg    = 0.035
jitter_yaw_deg      = 0.055

# ---------------------------------------------------------------------------
# THE FRONT
#
# Incoming fire from the enemy line, with no squad behind it: a scheduler that
# fires rounds from the enemy's front-line bays at the player, so near misses
# suppress. Off, light (a visitor's default: sporadic sniping) or heavy
# (machine-gun bursts that pin a man on the step within seconds at 22 m).
# ---------------------------------------------------------------------------

[front]
light_rpm           = 40.0     # aimed single shots, on average
light_gap_s         = 1.0      # never two nearer than this; the rest of each gap
                               # is drawn, so they come at light_rpm on average
light_miss_m        = 2.0      # light's rounds pass the head no nearer than this,
                               # and no further than spread_m past it: they crack
                               # by and strike the parapet, but cannot pin. One as
                               # near as it may (two cracks and its strike) adds
                               # ~0.17, and a gap bleeds off more than that
heavy_rpm           = 500.0    # rounds a minute on average, in bursts
burst_rounds        = 8        # a machine gun's burst
burst_rpm           = 600.0    # its cyclic rate within a burst; the pause after
                               # each is drawn about the mean that brings the
                               # rate to heavy_rpm
tracer_every        = 5        # every fifth of a burst a tracer
spread_m            = 1.6      # heavy's aim scatter about the head, sideways,
spread_vertical     = 0.6      # and this much of it up and down (the reference's
                               # rig); both across the line of fire
reach_m             = 30.0     # enemy bays within this, along the line, fire

# ---------------------------------------------------------------------------
# DESTRUCTION
#
# Every carve is followed by a collapse. A crater that leaves its spoil hanging
# in mid-air is wrong to look at and wrong to shoot through, and one that does
# not put its dirt anywhere has made cover out of nothing.
# ---------------------------------------------------------------------------

[destruction]
resists_above_hardness = 2.0   # concrete (4.0) and brick (2.6) survive the
                               # outer radius; soil and timber do not
core_radius_scale      = 0.55  # inside this, nothing survives
loosen_radius_scale    = 1.45  # rind of ground shaken into loose spoil, which
                               # is what actually falls into the trench
chip_energy_j          = 260.0 # per unit hardness, for a single round to mark
                               # a surface. A rifle round scars a parapet over
                               # a magazine; it does not dig through it.
collapse_max_passes    = 64
bricks_per_tick        = 512   # a crater's changed bricks written back a tick:
                               # about a millisecond (the spec's budget is 4 ms)

# ---------------------------------------------------------------------------
# VIEWKICK — cosmetic recoil
#
# Everything you FEEL when the gun goes off, and nothing that moves the bullet.
# Rounds fly along the [recoil] aim and would land in the same voxels if this
# whole section were zeroed. That is what lets it be tuned for weight while
# [recoil] stays light enough not to be a fight: difficulty lives up there,
# heft lives here, and the two never trade against each other.
#
# damping_ratio below 1 overshoots on the way back, which is what reads as mass.
# It belongs here and nowhere near the aim axis.
# ---------------------------------------------------------------------------

[viewkick.defaults]
punch_back_m        = 0.030    # shoved toward the eye; the biggest weight cue
punch_up_m          = 0.008
punch_side_m        = 0.002
punch_pitch_deg     = 1.10     # viewmodel only — the sight picture moves 0.34
punch_yaw_deg       = 0.15
punch_roll_deg      = 0.45
aim_pitch_follow    = 0.90     # viewmodel pitch per degree of aim kick, so the
                               # two layers are visibly one event
settle_time_s       = 0.22     # close to the aim layer's 0.20 so they finish
                               # together; drift these apart and the gun reads
                               # as two guns
damping_ratio       = 0.85     # overshoot: the mass settling back
fov_pulse_deg       = -0.55    # a snap in, not a zoom out
fov_settle_s        = 0.16
fov_damping_ratio   = 1.00     # no bounce on the lens; it reads as a wobble
report_peak_db      = 158.0    # 5.45 at the shooter's ear
report_low_hz       = 70.0     # where the body of the transient sits
report_length_s     = 0.18
jitter_scale        = 0.12     # per-shot variation, as a fraction of each value

[viewkick.assault_rifle]
punch_back_m        = 0.034
punch_pitch_deg     = 1.25
punch_roll_deg      = 0.55
damping_ratio       = 0.82
fov_pulse_deg       = -0.60

# ---------------------------------------------------------------------------
# PARTICLES
#
# Cosmetic, deterministic, and simulated on the sim side so a headless run makes
# the same brass as a windowed one. Nothing here is read by collision,
# ballistics or AI.
# ---------------------------------------------------------------------------

[particles]
pool_capacity       = 4096     # the spec's (the reference's was 1024): heavy fire's
                               # dust and a magazine's brass at once

# Each kind: how it lives (life, gravity, drag, size and colour from start to end,
# emissive or lit by the world), and how it is thrown (count; speed along its
# direction, plus lift upward; a normal spread and a share of speed jitter, as
# the reference's emit draws them).

[particles.muzzle_flash]
life_s              = 0.045    # two or three frames: a stab, not a flare
gravity             = 0.0
drag                = 12.0
size_start_m        = 0.12     # the reference's 0.34, drawn 1.2 m from the eye, was a
size_end_m          = 0.04     # disc 16 degrees across; a 5.45's flash is a hand's breadth
colour_start        = [1.0, 0.90, 0.55, 0.95]
colour_end          = [1.0, 0.45, 0.12, 0.0]
emissive            = true
count               = 1
speed               = 2.0      # out along the bore
lift                = 0.0
spread              = 0.0
speed_jitter        = 0.0

[particles.brass]
life_s              = 1.30
gravity             = -9.81
drag                = 0.35
size_start_m        = 0.028
size_end_m          = 0.028
colour_start        = [0.86, 0.68, 0.30, 1.0]
colour_end          = [0.70, 0.55, 0.24, 0.0]
emissive            = false
count               = 1
speed               = 2.6      # to the right
lift                = 1.5
spread              = 0.55
speed_jitter        = 0.2

[particles.dust]
life_s              = 0.90
gravity             = -1.5     # it hangs, then settles
drag                = 3.5
size_start_m        = 0.05
size_end_m          = 0.32
colour_start        = [2.0, 2.0, 2.0, 0.55] # times the struck material's colour: dry dust
colour_end          = [2.0, 2.0, 2.0, 0.0]  # is about twice as pale as the face it came
                                            # off (soil's albedo some 0.3 to 0.15); at 1.0,
                                            # lit as the face is and seen through the same
                                            # haze, a puff did not show against it
emissive            = false
count               = 7
speed               = 2.2      # off the struck face
lift                = 0.0
spread              = 0.9
speed_jitter        = 0.35

[particles.spark]
life_s              = 0.22
gravity             = -9.81
drag                = 1.5
size_start_m        = 0.014
size_end_m          = 0.006
colour_start        = [1.0, 0.78, 0.40, 1.0]
colour_end          = [1.0, 0.40, 0.10, 0.0]
emissive            = true
count               = 6        # off pickets, hulls, corrugated iron and wire
speed               = 7.0
lift                = 0.0
spread              = 2.5
speed_jitter        = 0.3

# The sound (src/audio): every voice made in WebAudio, nothing loaded. A sound is
# late by its distance at the speed of sound, quieter past reference_m, and duller
# toward far_m.
[audio]
speed_of_sound      = 343.0
master_gain         = 0.7
reference_m         = 2.0
rolloff             = 1.0      # gain as (reference / distance)^rolloff past it
far_m               = 150.0
far_lowpass_hz      = 2500.0   # what is left of a sound this far off
open_lowpass_hz     = 18000.0
crack_gain          = 0.9      # a round past your ear at nil miss, falling to
                               # nothing at suppression's crack radius
impact_gain         = 0.6
impact_within_m     = 60.0     # strikes further off are not heard
front_report_gain   = 0.9      # the enemy's reports at reference_m (yours is 1)

# What is drawn over the world after sharpening (render/effects.ts): tracers, each
# shot's flash star and light, and how the particles take the world's light. The
# intensities are against the world's own light; bloom takes what is too bright.
[effects]
tracer_length_m     = 7.0      # the reference's render.tracer_length_m
tracer_width_m      = 0.06     # receding from the shooter, a narrower one is a dash
tracer_colour       = [1.0, 0.83, 0.45] # the reference's
tracer_intensity    = 60.0
tracer_tail_alpha   = 0.16     # the reference's 40 of 255 at the tail, 255 at the head
tracer_converge_m   = 20.0     # the player's tracer leaves the muzzle and joins its
                               # round's path (from the eye) by this far
flash_s             = 0.03     # a shot's flash star and its light, in the world's
                               # seconds: two frames at 60 Hz, five at 144
particle_attach_s   = 0.15     # the shot's flash and brass leave the rifle as drawn,
                               # joining their own paths over this
flash_star_length_m = 0.22
flash_star_width_m  = 0.06
flash_colour        = [1.0, 0.86, 0.55]
flash_intensity     = 60.0
flash_light_radius_m  = 6.0    # a shot's light: warm, falling to nothing at this
flash_light_intensity = 3.0    # about a lantern's (render.lantern_intensity) for two
                               # frames: at 8, and 40, it lit the trench like noon
flash_light_colour    = [1.0, 0.72, 0.40]
rifle_specular      = 0.35     # the key's light off the rifle's steel, toward the eye
particle_glow       = 20.0     # the flash's and the sparks' particles
dust_key            = 0.5      # how much of the key's light a mote of dust or a
dust_sky            = 1.0      # case of brass takes (a flake turned every way: the
                               # mean of n·l), and of the mean of the sky's on its
                               # faces, in the open (near a face it takes the face's)

[viewmodel]
rest_right_m        = 0.175    # where the rifle sits when nothing is happening
rest_up_m           = -0.205
rest_forward_m      = 0.440
sway_follow         = 0.5      # the walk's sideways sway the rifle carries
run_dip_m           = 0.012    # how far it drops at a run (the reference's)
step_raise_m        = 0.14     # raised to the shoulder on the firing step, so it
                               # clears a crest 0.12 m under a standing eye (at
                               # rest it hangs 0.205 m under it, in the parapet)
raise_s             = 0.18     # how long raising and lowering it takes, roughly

# The trench periscope. Elevation is the payoff — this is the only way to look
# at no-man's-land from behind the parapet rather than over it — and the costs
# are a narrow field of view, near-immobility, and no weapon. Exposure is very
# low because what is above the crest is a mirror on a stick, not your head.
[stance.periscope]
height              = 1.80
speed               = 0.35
sprint_speed        = 0.35
sway_scale          = 0.55
exposure            = 0.22
transition_time     = 0.45
fov_scale           = 0.42     # the tunnel you are looking down

# The entrenching tool. Artillery degrades a position structurally — collapsed
# spoil ramps over a shelled traverse — and this is the counter. Priced in time
# spent standing up in a trench that no longer has a traverse.
#
# seconds_per_voxel is set from the measured fill: the worst blocked bay across
# seeds 7/21/99 holds 13-16 loose voxels, so 1.35 s each puts clearing it at
# about twenty seconds of continuous work.
[entrenching]
reach_m             = 1.60
seconds_per_voxel   = 1.35
exposure_scale      = 1.25     # you are up, and side-on, and not watching
sway_scale          = 1.60     # a shovel in your hands is not a rifle

# ---------------------------------------------------------------------------
# SUPPRESSION
#
# The whole reason small-arms fire matters at trench ranges: most rounds miss,
# and the ones that miss are still doing the work. Tuned so that being shot at
# with nothing hitting you is genuinely unpleasant.
#
# Levels are 0-1. A single close crack is worth about a fifth of the bar and a
# sustained burst pins you; the bar holds for hold_s after the last round so a
# burst does not bleed off between its own shots, then recovers over roughly
# three seconds of not being shot at.
# ---------------------------------------------------------------------------

[suppression]
crack_radius_m      = 3.20     # a supersonic round passing inside this
crack_amount        = 0.34     # at nil miss distance; falls off as the square
impact_radius_m     = 4.50     # dirt kicking up beside you
impact_amount       = 0.16     # frightening, but it does not mean they have
                               # your range the way a crack does
decay_per_s         = 0.42
hold_s              = 0.55
max_level           = 1.00

sway_at_full        = 4.20     # the dispersion cone at full suppression
speed_at_full       = 0.40     # pinned should mean pinned
flinch_deg          = 1.35     # muzzle dragged off by a near miss
flinch_recovery_s   = 0.45
eject_from_step_at  = 0.55     # above this you cannot stay head-up. Not a
                               # suggestion — the mechanic is that fire takes
                               # the parapet away from you without hitting you

shake_deg_at_full   = 0.85
shake_hz            = 7.5
desaturate_at_full  = 0.55
vignette_at_full    = 0.50
blur_at_full        = 0.55

[camera]
fov                 = 90.0
far_plane           = 400.0   # the map diagonal is 181 m; this is fog-limited,
                               # not clip-limited, so nothing ever pops in
near_plane          = 0.08
fov_lerp_per_s      = 7.0      # how fast the periscope's tunnel eases in
head_bob_amplitude  = 0.035
head_bob_hz         = 1.9
landing_dip         = 0.11

[render]
tracer_length_m     = 7.0      # streak behind the round, not a dot
tracer_colour       = [1.0, 0.83, 0.45]
upload_budget_kib   = 1024     # world edits sent to the GPU per frame, nearest first
key_cone_deg        = 0.6      # half-angle the key light's shadow ray jitters in: soft penumbrae
sky_ray_m           = 4.0      # how far a face looks for open sky
fog_height_m        = 14.0     # height fog thins by e over this many metres above the ground
history_max         = 32       # frames the denoiser averages at most
atrous_sigma_luma   = 4.0      # edge-stopping on brightness, in standard deviations
atrous_sigma_plane  = 1.0      # edge-stopping on distance from the face's plane, in voxels
cas_sharpness       = 0.4      # contrast-adaptive sharpening, 0 to 1
bloom_weight        = 0.04     # how much of the image's light its bloom spreads: a six-level pyramid, no threshold (bloom.ts)
bloom_max           = 30000.0  # the brightest a tap of the image is taken into the bloom at: how far the sun's disc (up to 30,000) lights the sky round it
gpu_budget_ms       = 14.0     # dynamic resolution holds the GPU frame under this
internal_mp_high    = 1.5      # internal image of the "high" preset, in megapixels
flares              = 6        # static flares hanging over no man's land at night
flare_radius_m      = 65.0
flare_intensity     = 260.0
lantern_radius_m    = 7.0      # each dugout's lantern
lantern_intensity   = 2.5
lantern_flicker     = 0.08     # the most a lantern's light strays either way, as a fraction of it (light-motion.ts)
flare_burn_s        = 40.0     # a flare burns this long, then is lit again where it began
flare_sink_mps      = 0.3      # how fast it sinks under its parachute as it burns
flare_ignite_s      = 0.5      # how long it takes to catch
flare_fade_s        = 5.0      # how long it gutters out over, at the end of its burn

# ---------------------------------------------------------------------------
# ATMOSPHERE
#
# The sky is sunlight scattered by air (Rayleigh) and haze (Mie), and dimmed
# by ozone, over a spherical earth (Hillaire 2020; see atmosphere.ts). These
# are Earth's, from his paper: per kilometre at the ground, each thinning
# with height. Colours are red, green, blue.
# ---------------------------------------------------------------------------

[atmosphere]
ground_radius_km      = 6360.0
top_radius_km         = 6460.0
rayleigh_per_km       = [5.802e-3, 13.558e-3, 33.1e-3]   # scattering; air absorbs none
rayleigh_height_km    = 8.0
mie_scattering_per_km = 3.996e-3
mie_extinction_per_km = 4.44e-3
mie_height_km         = 1.2
mie_g                 = 0.8      # haze scatters forward: the glow round the sun
ozone_per_km          = [0.65e-3, 1.881e-3, 0.085e-3]    # absorption at its peak
ozone_centre_km       = 25.0
ozone_half_width_km   = 15.0
ground_albedo         = 0.3

# ---------------------------------------------------------------------------
# THE SKY AND THE DAY
#
# The day runs on a 24-hour clock at a real site and date (sky-clock.ts): the
# sun and moon stand where the ephemeris puts them, and their light comes
# through the atmosphere above. Azimuths turn from +z (toward the enemy)
# toward +x. Colours are linear RGB with their intensity in them.
# ---------------------------------------------------------------------------

[sky]
# Where and when the sky is: the Somme, the night before the full moon of October 1916. The day
# runs on a 24-hour clock (sky-clock.ts); dusk is 17:35, when the sun is 4.5° up as the approved
# dusk had it, and night is 21:00, under a moon 34° up and 99.6% lit.
latitude_deg        = 50.0
longitude_deg       = 2.7      # east
date                = [1916, 10, 10]
utc_offset_h        = 1.0
map_bearing_deg     = 236.0    # compass bearing of +z (toward the enemy): it puts the dusk sun 18° right of ahead
sun_illuminance     = 6.55     # the sun's light above the air: it makes dusk's key light the approved one (its red 3.4)
moon_illuminance    = 0.0912   # the full moon's: the approved night's key, not the physical 1/400,000 of the sun's (sky-state.ts)
moon_tint           = [0.62, 1.0, 2.16]   # moonlight as it reads to the eye at night: blue-violet, as approved
star_gain           = 16.0     # the stars over their light against the moon's: the eye picks points of light out of a moonlit, hazy sky (to magnitude 4.5 here)
# Keyed to the clock: dawn 06:50, noon 12:00, dusk 17:35, night 21:00; between them by the hour.
fog_density         = [0.02, 0.006, 0.012, 0.02]   # per metre, at the ground
flares              = [0.2, 0.0, 0.0, 1.0]         # how brightly the static flares burn
# Film grain's deviation, in 8-bit steps, by the sun's height: the day's while it is up, the night's
# once it is 12° below the horizon, between by its depth.
grain_day           = 0.6      # under the dither's step
grain_night         = 3.0
# The frame is exposed by a bias over the light it shows (exposure.wgsl), keyed to hours of its
# own and geometric between them, round the clock. Dusk's and night's keep their approved exposures
# (1.0 and 3.2); night stays dark on purpose, held to 04:30. Twilight is darker than the moonlit
# night (the light at 18:29 is 31× under dusk's, the night's 18×), so the bias falls from dusk to
# 19:00 as fast as the day's 2% a game minute allows, and dips again before dawn: the exposure
# peaks at 8.4 (at 18:24), where following the light took it to 19.5.
exposure            = [["04:30", 0.175], ["06:20", 0.07], ["12:00", 1.2], ["17:35", 1.0], ["19:00", 0.12], ["21:00", 0.175]]
exposure_light      = 0.545    # the light (on the six faces, on average) that exposure 1 shows as approved: dusk's
exposure_floor      = 0.002    # the least light counted: a moonless night's
# The frame metered under that exposure (auto-exposure.ts): a view whose mean lies beyond a zone
# round the norm the approved views sit in is corrected by the excess, at the eye's rates.
# The six standard views at their hours meter (stops): bay -4.55, dugout -3.60, hamlet -1.67,
# overview -1.40, step -1.39, nml-night -1.29. The norm is their middle; the zone half their spread
# and a quarter stop more, so every approved view is left alone.
exposure_target     = -2.92    # the norm, in stops of log2 luminance under the reckoned exposure
exposure_zone       = 1.88     # stops either side of it left alone
adapt_to_darker     = 1.0      # stops a second the exposure rises, into a darker scene
adapt_to_brighter   = 3.0      # stops a second it falls, into a brighter one
# The haze the height fog and the smoke are, far denser than the air (sky.wgsl's fogColour): it
# glows with the key light it scatters, the sky's light from above and, at night, the front's. Set
# so dusk's and night's fog glow as approved (within 8% in each channel of the approved colours).
haze_key            = 0.215    # the share of the key light it glows with, looking any way
haze_forward        = 0.08     # and more toward the key, by cos⁴ of the angle: the approved glow
haze_sky            = 1.66     # the share of the sky's light from above (an up face's irradiance over π)
front_glow          = [0.0153, 0.0045, 0.0]   # the front's fires and flares on the haze, as the flares burn: night's violet
# Shafts (froxels.wgsl): the haze glows with the key light where the light reaches it. Where it does
# not, the lit haze round it still scatters some in: this share of the key's glow. The least that
# leaves every approved view's exposure uncorrected (the bay's, at dusk, lies nearest the edge of the
# meter's zone, and 0.63 tips it over), so the approved look holds; the shafts read at the rest.
haze_shadow         = 0.7
# And the point lights' glow on the haze (lanterns, flares), over the key's by the same phase: a
# tenth, so the approved night keeps its exposure (at a quarter, the meter corrects it).
haze_lights         = 0.1
# Smoke and dust over the lines: a second haze, thinner and taller than the ground fog, that veils
# the lower sky as the approved sky's horizon colour did.
smoke_density       = 0.00053  # per metre, at the ground
smoke_height_m      = 300.0    # it thins by e over this many metres
aureole             = 12.0     # the sky's glow round the key light (sun or moon), over the key's light at its middle, falling as cos⁹⁰⁰: some 2.7° to 1/e, the approved sun's glow

