# The sound (src/audio): every voice made in WebAudio, nothing loaded. A sound is
# late by its distance at the speed of sound, quieter past reference_m, and duller
# toward far_m.
[audio]
speed_of_sound      = 343.0
master_gain         = 0.7
reference_m         = 2.0
rolloff             = 1.0      # gain as (reference / distance)^rolloff past it
far_m               = 150.0
far_lowpass_hz      = 2500.0   # what is left of a sound this far off
open_lowpass_hz     = 18000.0
crack_gain          = 0.9      # a round past your ear at nil miss, falling to
                               # nothing at suppression's crack radius
impact_gain         = 0.6
impact_within_m     = 60.0     # strikes further off are not heard
front_report_gain   = 0.9      # the enemy's reports at reference_m (yours is 1)
whistle_gain        = 0.5      # a shell coming in, falling from whistle_from_hz to
whistle_from_hz     = 1400.0   # whistle_to_hz over its last whistle_s
whistle_to_hz       = 450.0
blast_gain          = 1.0      # a shell landing, heard at any distance
blast_rumble_s      = 1.8
scrape_gain         = 0.5      # a scoop dug: the blade's scrape and the spoil landing
flare_gain          = 0.4      # a flare fired: the pistol's pop and the flare's hiss as it climbs
# The distant guns (the battle spec's §3): a barrage's shell beyond the map rumbles, a far shell thumps,
# each late by its distance; quieter as the near end of its shells' range over the distance, and over
# that range duller (geometrically, from the second lowpass to the first) and longer.
rumble_gain         = 0.5      # at 1 km, the barrages' nearest (battle.barrages.distance_m)
rumble_lowpass_hz   = [80.0, 300.0]
rumble_length_s     = [1.5, 5.0]
thump_gain          = 0.6      # at 200 m, the far shells' nearest (battle.far_shells.distance_m)
thump_lowpass_hz    = [500.0, 1200.0]
thump_length_s      = [0.8, 1.5]
# A machine gun's burst at night (the battle's tracers): its rounds rattling at its rate, at its gun.
chatter_gain        = 0.5      # at 60 m; quieter as 60 m over the distance
chatter_range_m     = [60.0, 300.0]
chatter_lowpass_hz  = [400.0, 2000.0]   # duller across the range, geometrically
# A splash (the battle's water): a round going into water a short bandpassed "plip" at it, heard as
# near as an impact is; a shell landing on water a rush of low noise over a second with a thump, heard
# at any distance as a blast is. Each late by its distance, quieter and duller with it.
splash_gain         = 0.6
splash_shell_gain   = 1.2
splash_shell_s      = 1.2
# A fire's crackle (the battle's fires): each pop a highpassed burst and a click, at the fire, as
# loud as the fire's strength, quieter and duller with distance as a shot's is; none past this.
crackle_gain        = 0.4
crackle_within_m    = 30.0
max_voices          = 64       # sounding or waiting to (a distant one is scheduled seconds ahead); the farthest dropped first

# What is drawn over the world after sharpening (render/effects.ts): tracers, each
# shot's flash star and light, and how the particles take the world's light. The
# intensities are against the world's own light; bloom takes what is too bright.
[effects]
tracer_length_m     = 7.0      # the reference's render.tracer_length_m
tracer_width_m      = 0.06     # receding from the shooter, a narrower one is a dash
tracer_colour       = [1.0, 0.83, 0.45] # the reference's
tracer_intensity    = 60.0
tracer_tail_alpha   = 0.16     # the reference's 40 of 255 at the tail, 255 at the head
tracer_converge_m   = 20.0     # the player's tracer leaves the muzzle and joins its
                               # round's path (from the eye) by this far
flash_s             = 0.03     # a shot's flash star and its light, in the world's
                               # seconds: two frames at 60 Hz, five at 144
particle_attach_s   = 0.15     # the shot's flash and brass leave the rifle as drawn,
                               # joining their own paths over this
flash_star_length_m = 0.22
flash_star_width_m  = 0.06
flash_colour        = [1.0, 0.86, 0.55]
flash_intensity     = 60.0
flash_light_radius_m  = 6.0    # a shot's light: warm, falling to nothing at this
flash_light_intensity = 3.0    # about a lantern's (render.lantern_intensity) for two
                               # frames: at 8, and 40, it lit the trench like noon
flash_light_colour    = [1.0, 0.72, 0.40]
blast_light_s       = 0.3      # a shell's blast: a light a metre over its crater,
blast_light_radius_m = 30.0    # flaring and dying as (1 - t / this)^2, shadowed
blast_light_intensity = 300.0  # (a lantern is about 3 at 1 m; this, 0.5 at 20 m)
blast_light_colour  = [1.0, 0.62, 0.32]
smoke_s             = 15.0     # a shell's smoke in the haze: smoke_puffs puffs, each
smoke_puffs         = 3        # starting at smoke_radius_scale of the crater's radius,
smoke_radius_scale  = 0.6      # rising and spreading at these, and thinning as
smoke_rise_m_s      = 0.4      # (1 - t / smoke_s)^2 from smoke_density (per metre,
smoke_spread_m_s    = 0.25     # at a puff's middle, falling to nothing at its edge)
smoke_density       = 0.5
rifle_specular      = 0.35     # the key's light off the rifle's steel, toward the eye
particle_glow       = 20.0     # the flash's and the sparks' particles
dust_key            = 0.5      # how much of the key's light a mote of dust or a
dust_sky            = 1.0      # case of brass takes (a flake turned every way: the
                               # mean of n·l), and of the mean of the sky's on its
                               # faces, in the open (near a face it takes the face's)

[viewmodel]
rest_right_m        = 0.175    # where the rifle sits when nothing is happening
rest_up_m           = -0.205
rest_forward_m      = 0.440
sway_follow         = 0.5      # the walk's sideways sway the rifle carries
run_dip_m           = 0.012    # how far it drops at a run (the reference's)
step_raise_m        = 0.14     # raised to the shoulder on the firing step, so it
                               # clears a crest 0.12 m under a standing eye (at
                               # rest it hangs 0.205 m under it, in the parapet)
raise_s             = 0.18     # how long raising and lowering it takes, roughly

# The trench periscope. Elevation is the payoff — this is the only way to look
# at no-man's-land from behind the parapet rather than over it — and the costs
# are a narrow field of view, near-immobility, and no weapon. Exposure is very
# low because what is above the crest is a mirror on a stick, not your head.
[stance.periscope]
height              = 1.80
speed               = 0.35
sprint_speed        = 0.35
sway_scale          = 0.55
exposure            = 0.22
transition_time     = 0.45
fov_scale           = 0.42     # the tunnel you are looking down

# The entrenching tool. Artillery degrades a position structurally — collapsed
# spoil ramps over a shelled traverse — and this is the counter. Priced in time
# spent standing up in a trench that no longer has a traverse.
#
# The rate is the reference's, 0.125 m³ (its 0.5 m voxel) per 1.35 s, set there
# from the measured fill: the worst blocked bay across seeds 7/21/99 held 13-16
# loose voxels, so clearing it took about twenty seconds of continuous work. At
# 10 cm that is 93 voxels a second, cleared a scoop at a time.
[entrenching]
reach_m             = 1.60
m3_per_s            = 0.0926   # 0.125 m³ per 1.35 s
scoop_voxels        = 24       # a shovelful: 0.26 s of work, thrown at once
exposure_scale      = 1.25     # you are up, and side-on, and not watching
sway_scale          = 1.60     # a shovel in your hands is not a rifle

# ---------------------------------------------------------------------------
# SUPPRESSION
#
# The whole reason small-arms fire matters at trench ranges: most rounds miss,
# and the ones that miss are still doing the work. Tuned so that being shot at
# with nothing hitting you is genuinely unpleasant.
#
# Levels are 0-1. A single close crack is worth about a fifth of the bar and a
# sustained burst pins you; the bar holds for hold_s after the last round so a
# burst does not bleed off between its own shots, then recovers over roughly
# three seconds of not being shot at.
# ---------------------------------------------------------------------------

[suppression]
crack_radius_m      = 3.20     # a supersonic round passing inside this
crack_amount        = 0.34     # at nil miss distance; falls off as the square
impact_radius_m     = 4.50     # dirt kicking up beside you
impact_amount       = 0.16     # frightening, but it does not mean they have
                               # your range the way a crack does
blast_radius_m      = 25.0     # a shell landing inside this; light's nearest, at
blast_amount        = 0.60     # 15 m, adds 0.10, and does not pin alone
decay_per_s         = 0.42
hold_s              = 0.55
max_level           = 1.00

sway_at_full        = 4.20     # the dispersion cone at full suppression
speed_at_full       = 0.40     # pinned should mean pinned
flinch_deg          = 1.35     # muzzle dragged off by a near miss
flinch_recovery_s   = 0.45
eject_from_step_at  = 0.55     # above this you cannot stay head-up. Not a
                               # suggestion — the mechanic is that fire takes
                               # the parapet away from you without hitting you

shake_deg_at_full   = 0.85
shake_hz            = 7.5
desaturate_at_full  = 0.55
vignette_at_full    = 0.50
blur_at_full        = 0.55

[camera]
fov                 = 90.0
far_plane           = 400.0   # the map diagonal is 181 m; this is fog-limited,
                               # not clip-limited, so nothing ever pops in
near_plane          = 0.08
fov_lerp_per_s      = 7.0      # how fast the periscope's tunnel eases in
head_bob_amplitude  = 0.035
head_bob_hz         = 1.9
landing_dip         = 0.11

[render]
tracer_length_m     = 7.0      # streak behind the round, not a dot
tracer_colour       = [1.0, 0.83, 0.45]
upload_budget_kib   = 1024     # world edits sent to the GPU per frame, nearest first
key_cone_deg        = 0.6      # half-angle the key light's shadow ray jitters in: soft penumbrae
sky_ray_m           = 4.0      # how far a face looks for open sky
fog_height_m        = 14.0     # height fog thins by e over this many metres above the ground
history_max         = 32       # frames the denoiser averages at most
atrous_sigma_luma   = 4.0      # edge-stopping on brightness, in standard deviations
atrous_sigma_plane  = 1.0      # edge-stopping on distance from the face's plane, in voxels
cas_sharpness       = 0.4      # contrast-adaptive sharpening, 0 to 1
bloom_weight        = 0.04     # how much of the image's light its bloom spreads: a six-level pyramid, no threshold (bloom.ts)
bloom_max           = 30000.0  # the brightest a tap of the image is taken into the bloom at: how far the sun's disc (up to 30,000) lights the sky round it
gpu_budget_ms       = 14.0     # dynamic resolution holds the GPU frame under this
internal_mp_high    = 1.5      # internal image of the "high" preset, in megapixels
flares              = 6        # static flares hanging over no man's land at night
flare_radius_m      = 65.0
flare_intensity     = 260.0
lantern_radius_m    = 7.0      # each dugout's lantern
lantern_intensity   = 2.5
lantern_flicker     = 0.08     # the most a lantern's light strays either way, as a fraction of it (light-motion.ts)
# A flare a test gives (useLights) burns and sinks as sub-project 2's did; the scene's own are the battle's (src/battle).
flare_burn_s        = 40.0     # a flare burns this long, then is lit again where it began
flare_sink_mps      = 0.3      # how fast it sinks under its parachute as it burns
flare_ignite_s      = 0.5      # how long it takes to catch
flare_fade_s        = 5.0      # how long it gutters out over, at the end of its burn
# The water's reflection (reflect.wgsl): traced this far, the sky beyond; the flares' and fires'
# glints, each a disc of its light (its radius, metres), and their gain.
reflect_m           = 160.0
glint_m             = 0.4
glint_fire_m        = 0.6
glint_gain          = 1.0

# ---------------------------------------------------------------------------
# ATMOSPHERE
#
# The sky is sunlight scattered by air (Rayleigh) and haze (Mie), and dimmed
# by ozone, over a spherical earth (Hillaire 2020; see atmosphere.ts). These
# are Earth's, from his paper: per kilometre at the ground, each thinning
# with height. Colours are red, green, blue.
# ---------------------------------------------------------------------------

[atmosphere]
ground_radius_km      = 6360.0
top_radius_km         = 6460.0
rayleigh_per_km       = [5.802e-3, 13.558e-3, 33.1e-3]   # scattering; air absorbs none
rayleigh_height_km    = 8.0
mie_scattering_per_km = 3.996e-3
mie_extinction_per_km = 4.44e-3
mie_height_km         = 1.2
mie_g                 = 0.8      # haze scatters forward: the glow round the sun
ozone_per_km          = [0.65e-3, 1.881e-3, 0.085e-3]    # absorption at its peak
ozone_centre_km       = 25.0
ozone_half_width_km   = 15.0
ground_albedo         = 0.3

# ---------------------------------------------------------------------------
# THE SKY AND THE DAY
#
# The day runs on a 24-hour clock at a real site and date (sky-clock.ts): the
# sun and moon stand where the ephemeris puts them, and their light comes
# through the atmosphere above. Azimuths turn from +z (toward the enemy)
# toward +x. Colours are linear RGB with their intensity in them.
# ---------------------------------------------------------------------------

[sky]
# Where and when the sky is: the Somme, the night before the full moon of October 1916. The day
# runs on a 24-hour clock (sky-clock.ts); dusk is 17:35, when the sun is 4.5° up as the approved
# dusk had it, and night is 21:00, under a moon 34° up and 99.6% lit.
latitude_deg        = 50.0
longitude_deg       = 2.7      # east
date                = [1916, 10, 10]
utc_offset_h        = 1.0
map_bearing_deg     = 236.0    # compass bearing of +z (toward the enemy): it puts the dusk sun 18° right of ahead
sun_illuminance     = 6.55     # the sun's light above the air: it makes dusk's key light the approved one (its red 3.4)
moon_illuminance    = 0.0912   # the full moon's: the approved night's key, not the physical 1/400,000 of the sun's (sky-state.ts)
moon_tint           = [0.62, 1.0, 2.16]   # moonlight as it reads to the eye at night: blue-violet, as approved
star_gain           = 16.0     # the stars over their light against the moon's: the eye picks points of light out of a moonlit, hazy sky (to magnitude 4.5 here)
# Keyed to the clock: dawn 06:50, noon 12:00, dusk 17:35, night 21:00; between them by the hour.
fog_density         = [0.02, 0.006, 0.012, 0.02]   # per metre, at the ground
flares              = [0.2, 0.0, 0.0, 1.0]         # how brightly the static flares burn
flash_glow          = [1.4, 1.5, 1.4, 0.4]         # the radiance of the haze lit over a barrage's flash at full power ([battle.flashes]): to read against dusk's haze (some 0.5) as against night's (0.025), and no stronger by night
# Film grain's deviation, in 8-bit steps, by the sun's height: the day's while it is up, the night's
# once it is 12° below the horizon, between by its depth.
grain_day           = 0.6      # under the dither's step
grain_night         = 3.0
# The frame is exposed by a bias over the light it shows (exposure.wgsl), keyed to hours of its
# own and geometric between them, round the clock. Dusk's and night's keep their approved exposures
# (1.0 and 3.2); night stays dark on purpose, held to 04:30. Twilight is darker than the moonlit
# night (the light at 18:29 is 31× under dusk's, the night's 18×), so the bias falls from dusk to
# 19:00 as fast as the day's 2% a game minute allows, and dips again before dawn: the exposure
# peaks at 8.4 (at 18:24), where following the light took it to 19.5.
exposure            = [["04:30", 0.175], ["06:20", 0.07], ["12:00", 1.2], ["17:35", 1.0], ["19:00", 0.12], ["21:00", 0.175]]
exposure_light      = 0.545    # the light (on the six faces, on average) that exposure 1 shows as approved: dusk's
exposure_floor      = 0.002    # the least light counted: a moonless night's
# The frame metered under that exposure (auto-exposure.ts): a view whose mean lies beyond a zone
# round the norm the approved views sit in is corrected by the excess, at the eye's rates.
# The six standard views at their hours meter (stops): bay -4.55, dugout -3.60, hamlet -1.67,
# overview -1.40, step -1.39, nml-night -1.29. The norm is their middle; the zone half their spread
# and a quarter stop more, so every approved view is left alone.
exposure_target     = -2.92    # the norm, in stops of log2 luminance under the reckoned exposure
exposure_zone       = 1.88     # stops either side of it left alone
adapt_to_darker     = 1.0      # stops a second the exposure rises, into a darker scene
adapt_to_brighter   = 3.0      # stops a second it falls, into a brighter one
# The haze the height fog and the smoke are, far denser than the air (sky.wgsl's fogColour): it
# glows with the key light it scatters, the sky's light from above and, at night, the front's. Set
# so dusk's and night's fog glow as approved (within 8% in each channel of the approved colours).
haze_key            = 0.215    # the share of the key light it glows with, looking any way
haze_forward        = 0.08     # and more toward the key, by cos⁴ of the angle: the approved glow
haze_sky            = 1.66     # the share of the sky's light from above (an up face's irradiance over π)
front_glow          = [0.0153, 0.0045, 0.0]   # the front's fires and flares on the haze, as the flares burn: night's violet
# Shafts (froxels.wgsl): the haze glows with the key light where the light reaches it. Where it does
# not, the lit haze round it still scatters some in: this share of the key's glow. The least that
# leaves every approved view's exposure uncorrected (the bay's, at dusk, lies nearest the edge of the
# meter's zone, and 0.63 tips it over), so the approved look holds; the shafts read at the rest.
haze_shadow         = 0.7
# And the point lights' glow on the haze (lanterns, flares), over the key's by the same phase: a
# tenth, so the approved night keeps its exposure (at a quarter, the meter corrects it).
haze_lights         = 0.1
# Smoke and dust over the lines: a second haze, thinner and taller than the ground fog, that veils
# the lower sky as the approved sky's horizon colour did.
smoke_density       = 0.00053  # per metre, at the ground
smoke_height_m      = 300.0    # it thins by e over this many metres
aureole             = 12.0     # the sky's glow round the key light (sun or moon), over the key's light at its middle, falling as cos⁹⁰⁰: some 2.7° to 1/e, the approved sun's glow


# ---------------------------------------------------------------------------
# THE BATTLE AROUND YOU (sub-project 4, docs/superpowers/specs/2026-10-23-trenchline-web-battle-design.md)
#
# The wind over the whole map (src/battle/wind.ts), a pure function of time: it carries the flares
# and leans the smoke. Bearings are as yaw: the way it blows toward, 0 = +z, 90 = +x. It blows along
# the front, so the flares drift along no man's land and light it as the approved night's did; blowing
# across from the enemy's side at up to 5 m/s it carried them over the lines behind, and no man's land
# had a sixth of that light.
[battle.wind]
prevailing_deg      = 270.0    # along the front, from the right (+x) toward the left
veer_deg            = 20.0     # the most it veers either way of that, in two slow sines
veer_period_s       = [900.0, 2400.0]   # their periods: a few degrees a minute at most
speed_mps           = [1.0, 3.0]   # its bounds; it blows at their middle, and gusts
gust_mps            = 1.5      # the two gust sines together, at most
gust_period_s       = [20.0, 90.0]

# The flares both lines fire at night (src/battle/flares.ts, director.ts): from a post on a front
# line's parapet, out over no man's land, to burst at the top of the climb and drift on the wind.
# They burst low enough to light the field as the approved night's flares, which hung 22–32 m up:
# their light reaches 65 m, and over a burn they sink 12 m.
[battle.flares]
burst_m             = [25.0, 40.0]   # above the post, at the apogee
elevation_deg       = [70.0, 85.0]
spread_deg          = 20.0     # either way of straight across no man's land
sink_mps            = 0.3      # under the parachute, as it burns
burn_s              = 40.0
ignite_s            = 0.5
fade_s              = 5.0      # it gutters out over the last of its burn
radius_m            = 65.0
intensity           = 260.0
white               = [1.0, 0.88, 0.7]
red                 = [1.0, 0.25, 0.15]
red_share           = 0.25
mean_light          = 6.0      # flares alight at once on average at the front's light intensity
heavy_scale         = 2.5      # and at heavy, as many again and a half
off_per_min         = 1.0      # a quiet night's
dark_above          = 0.1      # fired only while the sky's flares key is above this
sun_below_deg       = 0.0      # and the sun below this: the key is 0.2 at dawn, and falls to 0.1 only with the sun 19° up
max_alight          = 16       # never more alight at once (a heavy night's would reach 28 now and then)
pre_roll_s          = 45.0     # a jump into the dark finds a night this far under way: a flare's climb and burn
near_share          = 0.25     # fired from the posts near the player
near_m              = 60.0     # along the line
spark_size_m        = 0.15     # the spark a flare trails as it climbs (an emissive point)
spark_glow          = 6.0      # its brightness, over its colour
disc_size_m         = 0.4      # a burning flare seen: a bright disc in the sky
disc_glow           = 12.0     # at full burn, over its colour

# Barrages beyond the map (src/battle/barrages.ts): from the map's middle, 1–8 km off along the front
# to either side and beyond the enemy's line; a run of shells over a while, each a flash on the horizon
# and a rumble after its distance. At light a barrage every few minutes; at heavy one or two in progress
# (a mean of 35 s each); none off. They do not wait for the dark.
[battle.barrages]
every_light_s       = 150.0    # mean seconds between barrages' starts
every_heavy_s       = 20.0
arc_deg             = 110.0    # either way of toward the enemy (+z): both flanks and beyond their line
distance_m          = [1000.0, 8000.0]
shells              = [6, 40]
duration_s          = [10.0, 60.0]
width_m             = 400.0    # the box its shells fall in: across the way to it
depth_m             = 150.0    # and along it
power               = [0.6, 1.4]   # each shell's own, over a flash's at full

# Shells into the far field (src/battle/far-shells.ts): 200–800 m from the map's middle, beyond its edge,
# within arc_deg of toward the enemy. Each flashes (a disc growing over flash_s, and its flash's light on the
# far field and the haze), throws up a column of smoke that rises and leans with the wind for a minute,
# and thumps after its distance. They cut no craters: the far field is a height field.
[battle.far_shells]
every_light_s       = 30.0     # mean seconds between them at the front's light intensity
every_heavy_s       = 5.0
distance_m          = [200.0, 800.0]
arc_deg             = 110.0
power               = [0.6, 1.4]   # each shell's own, over a flash's at full
flash_s             = 0.2      # its disc grows and fades over this
flash_size_m        = [6.0, 12.0]   # across, from its first frame to its last
flash_glow          = 3.0      # its brightness, over the flash's colour
smoke_s             = 60.0     # its column stands this long, thinning
puffs               = 8        # the column's puffs, let out one by one
puff_every_s        = 0.5
rise_mps            = 10.0     # each rises this fast at first, slowing by e over rise_s: to some 100 m, over the low dusk haze
rise_s              = 10.0
puff_radius_m       = [8.0, 24.0]   # each grows over the column's life
smoke_alpha         = 0.85     # how much it covers at first
smoke_colour        = [0.06, 0.055, 0.05]   # the black smoke of high explosive: lit by a low sun, a paler grey went into the haze

# Machine guns on both lines (src/battle/tracers.ts, director.ts), beyond the stretch of front that
# fires at the player: bursts at night, every fifth round a tracer, swept across a bearing over no man's
# land and the field; the rifle round's ballistics simplified (its drag, gravity), without strikes.
[battle.tracers]
bursts_light        = 5.0      # bursts a second at the front's light intensity: some 25 tracers in flight
heavy_scale         = 2.5      # and heavy's over that
rounds              = [5, 20]
rpm                 = 600.0
tracer_every        = 5        # rounds 0, 5, 10 and 15 of a burst
spread_deg          = 45.0     # either way of straight across
sweep_deg           = 10.0     # the gun turns this far over a burst
elevation_deg       = [0.5, 8.0]   # some arcing high over the field: fired near level, from the trench they came on as dots
muzzle_mps          = 820.0
burn_s              = 3.0      # a tracer burns this long from its firing
ricochet_share      = 0.1667   # of those that strike: one in six
ricochet_speed      = 0.35     # of its speed where it struck
ricochet_up_deg     = [10.0, 40.0]
clear_m             = 60.0     # guns stand further than this along the line from the player
graze_share         = 0.5      # bursts laid on the field graze_m out: they strike, and ricochet, near (the rest arc over it)
graze_m             = [40.0, 200.0]
miss_m              = 30.0     # a burst whose fire would pass nearer the player is not fired
max_drawn           = 400      # the nearest the eye drawn; the farther not
trail_m             = 24.0     # each drawn with this much trail: two frames' flight at 60 Hz, the streak a far one makes (the player's own keep [effects] tracer_length_m)

# Fires (src/battle/fires.ts, director.ts): a shell striking timber, cloth or duckboards starts one a
# third of the time, a hull a fifth; at night the hamlet's ruins burn. A fire grows, burns its while
# and dies down; it lights its surroundings (a light of its own, flickering), throws flames and embers,
# smokes into the haze leaning downwind, chars what it burned and crackles close by. It does not spread.
[battle.water]
# The water's rings (src/battle/water.ts, director.ts): each round or shell that falls in water starts
# a ring, spreading and fading; the surface takes the newest, and the wind's roughness on top.
ring_speed_mps      = 1.0
ring_fade_s         = 2.0
max_rings           = 32
ring_height_m       = 0.04     # a whole ring's height at its start; fading as (1 − age/fade)²
ring_log_full       = 6.0      # log10 of the energy (J) of a whole ring: a shell's megajoules; a round's kilojoule a half
ring_wavelength_m   = 0.3
ring_width_m        = 0.15     # the wave packet's width about its radius, widening 0.1 m a second
