# ---------------------------------------------------------------------------
# TRENCHLINE — feel tuning
#
# Every number that decides how the game FEELS lives here. Logic modules read
# values by dotted key and never hard-code a magnitude. Edit freely; nothing in
# here changes behaviour structurally, only its shape and scale.
#
# Units: metres, seconds, degrees, kilograms.
# ---------------------------------------------------------------------------

[world]
voxel_size          = 0.5
size_x              = 256      # voxels -> 128 m
size_y              = 64       # voxels ->  32 m
size_z              = 256      # voxels -> 128 m
ground_level        = 32       # voxel y of the undisturbed field surface
water_table         = 25       # voxel y below which open cavities flood.
                               # Sits just under the trench floor: the line
                               # stays dry, but a crater deeper than ~2 m
                               # fills, and a shell in the trench floods it.
chunk_rebuilds_per_frame = 4   # destruction budget; ~1-3 ms at this value

[world.trench]
depth_voxels        = 5        # 2.5 m from field surface to duckboards
width_voxels        = 5        # 2.5 m of trench, wall to wall: a 1.0 m
                               # walkway plus a 1.5 m firing step. 3.0 m was a
                               # communication trench, not a fire bay.
step_bench_voxels   = 1        # columns of bench, at full step height
step_tread_voxels   = 2        # columns of stair below it, one voxel apart, so
                               # the step can be mounted from anywhere along the
                               # walkway. Together these eat width_voxels - 3 of
                               # walkway; a body is 0.60 m across, so what is
                               # left may not go below 2 columns.
parados_height      = 1        # 0.5 m on the friendly side; lower than
                               # the parapet so you are not silhouetted
parapet_min_height  = 2        # floor under the crest: 1.0 m of spoil above the
                               # local field even where the view needs nothing
parapet_thickness   = 4        # courses of spoil; the outer ones fall away one
                               # voxel each, so a tall parapet is a bank not a wall
bay_length_m        = 8.0      # traverse spacing
traverse_offset_m   = 2.0      # lateral jog; equals the width, so a straight
                               # shot down the trench always meets an end wall

# The firing step is climbed by a flight running ALONG the bay, not across it,
# so its height costs bay length (of which there is 8 m) instead of walkway
# width (of which there is barely 1 m). That is what lets it vary per bay.
# The across-bay treads carry (step_tread_voxels + 1) voxels of rise, because
# each column is worth one voxel of step-up. Any bay that needs more than that
# takes the remainder on a flight running ALONG the bay, which costs bay length
# (8 m of it) instead of walkway width (1.5 m of it). That is what decouples
# step height from trench width and lets the step vary per bay.
firing_step_min     = 3        # 1.5 m: the shallowest step that still works
firing_step_max     = 7        # 3.5 m: past this the parapet is a redoubt

# Crest clearance is NOT a global constant. Each fire bay measures the ground it
# has to see over, raises its step until a standing eye clears it, and builds
# its crest at step_top + floor(standing_eye / voxel_size) = step_top + 3. That
# puts a standing eye 0.12 m over its own crest and a crouched eye 0.40 m under
# it, in every bay, whatever the terrain is doing. Generation asserts it.
sight_range_m       = 60.0     # how far out the ground has to read
sight_near_m        = 14.0     # near band, where a rise walls you in outright
sight_percentile    = 88.0     # of corridor ground the standing eye must clear
sight_margin_m      = 0.40     # over that ground: covers one voxel of ejecta
crest_smoothing_voxels = 2     # max crest drop between neighbouring bays

# Ploughed farmland: broad swells, not chop. Amplitude is what gives no-man's-
# land shape; wavelength is what decides whether that shape blocks the peek.
# High-frequency octaves are the expensive kind — a 1 m bump 20 m out costs more
# view than a 1 m swell 60 m out — so amplitude buys relief and persistence
# spends it. Raised from 0.875 m once crest clearance stopped being global.
# Measured: amplitude does NOT change how far shell holes read (42-44 m across
# 1.0-3.0 m); an eye 1.1 m over the field is the binding constraint, not the
# terrain. What amplitude and the swale buy is the WORST bay: p10 crater reach
# 30 m -> 37 m. See tools/sightlines.py.
[world.field]
relief_amplitude_m  = 2.00     # +/- about the nominal ground level
relief_octaves      = 4
relief_base_cells   = 3        # ~42 m at the base octave
relief_persistence  = 0.34     # < 0.5: the fine octaves stay quiet

# Both lines sit on the shoulders of a shallow dry watercourse, which is what
# SUKHYI YAR is named for. This is the half of "relief" that actually makes
# no-man's-land read: an eye 1.1 m over a flat field sees ground past ~20 m
# edge-on however much vertical relief it has, and a concave dip is the one
# shape fully visible from its own rim. Kept shallow enough that the trough
# floor stays above the water table, so the middle holds shell holes and not a
# lake. Set to 0.0 for a flat field.
swale_depth_m       = 1.50
swale_margin_voxels = 10.0     # how far past each line the dip reaches

# Battlefield layout, in voxels along z (0 = friendly rear, max = enemy rear).
[world.layout]
support_line_z      = 40
front_line_z        = 84
enemy_front_z       = 186
enemy_support_z     = 226
comm_trench_x       = [56, 168]
shelterbelt_z       = [24, 150, 244]

[player]
mass                = 82.0
eye_height_standing = 1.62
eye_height_crouched = 1.10
eye_height_prone    = 0.34
radius              = 0.30
step_up             = 0.55     # one voxel plus tolerance: climb the firing step
gravity             = -19.6    # 2 g — arcade-leaning, keeps jumps snappy
jump_speed          = 5.0
ground_accel        = 62.0
air_accel           = 9.0
ground_friction     = 11.0
max_fall_speed      = 55.0
mouse_sensitivity   = 0.14
pitch_limit         = 88.0

# Stance is a tradeoff: speed and vision against how much of you is showing.
# `exposure` scales incoming hit probability; `sway_scale` multiplies weapon
# sway and recoil recovery time.
[stance.standing]
height              = 1.80
speed               = 4.1
sprint_speed        = 6.4
sway_scale          = 1.00
exposure            = 1.00
transition_time     = 0.00

[stance.crouched]
height              = 1.25
speed               = 2.0
sprint_speed        = 2.0
sway_scale          = 0.72
exposure            = 0.62
transition_time     = 0.22

[stance.prone]
height              = 0.55
speed               = 0.75
sprint_speed        = 0.75
sway_scale          = 0.38
exposure            = 0.28
transition_time     = 0.75

# Standing on the firing step: full vision, full exposure, and the trench no
# longer protects you. This is the fast/dangerous option against the periscope.
[stance.firing_step]
height              = 1.80
speed               = 1.2
sprint_speed        = 1.2
sway_scale          = 0.85
exposure            = 1.35
transition_time     = 0.30

[camera]
fov                 = 90.0
far_plane           = 320.0
near_plane          = 0.08
head_bob_amplitude  = 0.035
head_bob_hz         = 1.9
landing_dip         = 0.11

[weather]
fog_near            = 14.0
fog_far             = 135.0
sky_colour          = [0.63, 0.64, 0.63]   # flat overcast
