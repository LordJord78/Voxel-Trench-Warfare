[project]
name = "trenchline"
version = "0.1.0"
description = "Voxel trench-warfare shooter"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "ursina>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["trenchline*"]
